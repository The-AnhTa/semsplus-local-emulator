services:
  backend:
    build:
      context: ./backend
    environment:
      CER_DATABASE_PATH: /data/cer-emulator.db
      CER_TRANSITION_DELAY_SECONDS: "0.15"
      CONTROL_REQUEST_TTL_SECONDS: "${CONTROL_REQUEST_TTL_SECONDS:-120}"
      OPENCLAW_CLI_PATH: "${OPENCLAW_CLI_PATH:-openclaw}"
      OPENCLAW_CONTROLLER_AGENT: "${OPENCLAW_CONTROLLER_AGENT:-controller}"
      OPENCLAW_SESSION_KEY: "${OPENCLAW_SESSION_KEY:-agent:controller:main}"
      OPENCLAW_CLI_TIMEOUT_SECONDS: "${OPENCLAW_CLI_TIMEOUT_SECONDS:-60}"
    volumes:
      - cer-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  cer-data:
